data:
  path: data/raw/dataset.csv
  target: target
  test_size: 0.2
  val_size: 0.0
  random_state: 42
  stratified: true

preprocessing:
  imputation:
    method: mean
  outliers:
    method: none
  transformation:
    method: none
  scaling:
    method: standard
  encoding:
    method: onehot
  feature_selection:
    method: none
  dimensionality:
    method: none

model:
  name: random_forest
  params:
    n_estimators: 100
    max_depth: null
    random_state: 42

cross_validation:
  method: kfold
  n_splits: 5
  shuffle: true
  random_state: 42

metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
