models:
  - name: random_forest
    params:
      n_estimators: [50, 100, 200]
      max_depth: [null, 10, 20]
      random_state: 42

  - name: svm
    params:
      kernel: [linear, rbf]
      C: [0.1, 1.0, 10.0]
      random_state: 42

  - name: knn
    params:
      n_neighbors: [3, 5, 7, 9]
      weights: [uniform, distance]

  - name: xgboost
    params:
      n_estimators: [50, 100]
      learning_rate: [0.01, 0.1]
      random_state: 42

  - name: lightgbm
    params:
      n_estimators: [50, 100]
      learning_rate: [0.01, 0.1]
      random_state: 42

  - name: logistic
    params:
      C: [0.1, 1.0, 10.0]
      penalty: [l2]
      random_state: 42
