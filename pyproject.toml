[project]
name = "ml-playground"
version = "0.1.0"
description = "Plataforma modular de experimentação em Machine Learning"
readme = "README.md"
authors = [
    { name = "KevBoyz", email = "kevboyz@pm.me" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "pandas>=3.0.5",
    "polars>=1.43.1",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "xgboost>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
ml-playground = "ml_playground.experiments.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
