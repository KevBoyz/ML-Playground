models:
  - name: kmeans
    params:
      n_clusters: [2, 3, 4, 5, 6]
      n_init: [10, 25]
      random_state: [42]

  - name: dbscan
    params:
      eps: [0.3, 0.4, 0.5, 0.6, 0.7]
      min_samples: [3, 4, 5]

  - name: agglomerative
    params:
      n_clusters: [2, 3, 4, 5, 6]
      linkage: [ward, complete, average, single]
