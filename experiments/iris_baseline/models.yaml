models:
  - name: knn
    params:
      n_neighbors: [3, 5]
      weights: [uniform, distance]

  - name: logistic_regression
    params:
      C: [0.1, 1.0]
      max_iter: [1000]
      random_state: [42]

  - name: svm
    params:
      kernel: [linear, rbf]
      C: [1.0]
      probability: [true]
      random_state: [42]

  - name: decision_tree
    params:
      max_depth: [null, 5]
      random_state: [42]
