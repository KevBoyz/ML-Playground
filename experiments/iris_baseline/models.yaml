models:
  - name: knn
    params:
      n_neighbors: [3, 5]
      weights: [uniform, distance]

  - name: logistic_regression
    params:
      C: [0.1, 1.0, 10.0]
      max_iter: [2000]
      random_state: [42]

  - name: svm
    params:
      kernel: [linear, rbf]
      C: [1.0, 10.0]
      probability: [true]
      random_state: [42]

  - name: decision_tree
    params:
      max_depth: [null, 3, 5]
      min_samples_leaf: [1, 2]
      random_state: [42]

  - name: random_forest
    params:
      n_estimators: [100, 200]
      max_depth: [null, 5]
      max_features: [sqrt]
      random_state: [42]
      n_jobs: [1]

  - name: xgboost
    params:
      n_estimators: [50, 100]
      max_depth: [2, 3]
      learning_rate: [0.05]
      subsample: [0.8]
      colsample_bytree: [0.8]
      eval_metric: [mlogloss]
      random_state: [42]
      n_jobs: [1]

  - name: lightgbm
    params:
      n_estimators: [50, 100]
      num_leaves: [7, 15]
      learning_rate: [0.05]
      max_depth: [-1]
      verbosity: [-1]
      random_state: [42]
      n_jobs: [1]
