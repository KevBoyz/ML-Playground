models:
  - name: dummy_classifier
    params:
      strategy: [prior]

  - name: knn
    params:
      n_neighbors: [3, 5]
      weights: [distance]

  - name: logistic_regression
    params:
      C: [1.0]
      max_iter: [1000]
      random_state: [42]

  - name: decision_tree
    params:
      max_depth: [3]
      min_samples_leaf: [1]
      random_state: [42]
