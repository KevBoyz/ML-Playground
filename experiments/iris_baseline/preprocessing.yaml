numeric:
  steps:
    - name: imputation
      category: imputation
      method: median
    - name: transformation
      category: transformation
      method: yeojohnson
    - name: outliers
      category: outliers
      method: iqr
      params:
        multiplier: 1.5
    - name: scaling
      category: scaling
      method: standard
    - name: feature_selection
      category: feature_selection
      method: f_classif
      params:
        k: 3
    - name: dimensionality
      category: dimensionality
      method: pca
      params:
        n_components: 0.95

categorical:
  steps:
    - name: imputation
      category: imputation
      method: mode
    - name: encoding
      category: encoding
      method: onehot
