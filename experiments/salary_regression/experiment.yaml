contract_version: 1
name: salary_regression
task: regression

data:
  path: data/raw/salary_regression.csv
  read_options: {}
  target: annual_salary
  metadata_columns: []
  features:
    numeric:
      - years_experience
      - projects_delivered
  schema:
    mode: strict
    dtypes:
      years_experience: Int64
      projects_delivered: Int64
      annual_salary: Int64
  random_state: 42

evaluation:
  protocol: development
  evaluate_final_test: false
  splitter:
    name: kfold
    n_splits: 3
    shuffle: true
    random_state: 42

outputs:
  root: reports
  save_model: true
  save_predictions: true
  predictions_format: both
  figures: true

selection:
  primary_metric: rmse
  direction: minimize
  tie_breakers: [metric_std, candidate_id]
  baseline_candidate: dummy_regressor

provenance:
  recipe_ref: notebooks/07-Salary_prediction/main.ipynb
  recipe_revision: bundled-demo-v1
  source_description: Tabela salarial compacta incluída para demonstrar regressão tabular.

search:
  strategy: grid
  max_candidates: 5

execution:
  n_jobs: 1
  max_wall_time_seconds: 60
  on_candidate_error: continue
