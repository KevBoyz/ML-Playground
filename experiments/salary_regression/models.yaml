models:
  - name: dummy_regressor
    params:
      strategy: [mean]

  - name: linear_regression
    params: {}

  - name: ridge
    params:
      alpha: [0.01, 0.1, 1.0, 10.0]

  - name: lasso
    params:
      alpha: [0.01, 0.1, 1.0]
      max_iter: [10000]

  - name: elastic_net
    params:
      alpha: [0.01, 0.1, 1.0]
      l1_ratio: [0.2, 0.5, 0.8]
      max_iter: [10000]

  - name: random_forest_regressor
    params:
      n_estimators: [100, 300]
      max_depth: [null, 5]
      random_state: [42]
      n_jobs: [1]
